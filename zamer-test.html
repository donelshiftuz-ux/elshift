<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zamer sinov</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --bg: var(--tg-theme-bg-color, #ffffff);
    --text: var(--tg-theme-text-color, #1d2125);
    --hint: var(--tg-theme-hint-color, #7c858d);
    --btn: var(--tg-theme-button-color, #1f6feb);
    --btn-text: var(--tg-theme-button-text-color, #ffffff);
    --card: var(--tg-theme-secondary-bg-color, #f1f3f5);
  }
  *{box-sizing:border-box}
  body{margin:0;padding:18px 16px 40px;background:var(--bg);color:var(--text);
       font:16px/1.45 -apple-system,"Segoe UI",Roboto,sans-serif}
  h1{font-size:22px;margin:0 0 4px}
  .sub{color:var(--hint);margin:0 0 18px;font-size:14px}
  section{background:var(--card);border-radius:14px;padding:14px;margin-bottom:14px}
  h2{font-size:17px;margin:0 0 10px}
  button,.pick{display:block;width:100%;border:0;border-radius:10px;padding:14px;
       background:var(--btn);color:var(--btn-text);font-size:16px;font-weight:600;text-align:center;cursor:pointer}
  .pick input{display:none}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
  .grid img,.grid video{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;background:#0002}
  .out{margin-top:10px;font-size:14px;word-break:break-word}
  .ok{color:#1a8f3c;font-weight:600}
  .err{color:#c62828;font-weight:600}
  a{color:var(--btn)}
  .nav{display:grid;gap:8px;margin-top:10px}
  .navbtn{display:block;text-align:center;padding:12px;border-radius:10px;background:#fc3f1d;color:#fff;text-decoration:none;font-weight:600}
  .navbtn.alt{background:transparent;color:var(--btn);border:1.5px solid var(--btn)}
  .env{font-size:13px;color:var(--hint)}
</style>
</head>
<body>
  <h1>Zamer sinov sahifasi</h1>
  <p class="sub">Rasm, video va lokatsiyani oyna yopilmasdan qo'shishni tekshiradi. Hech narsa saqlanmaydi.</p>

  <section>
    <h2>Rasm va video</h2>
    <label class="pick">Galereyadan tanlash
      <input id="files" type="file" accept="image/*,video/*" multiple>
    </label>
    <div id="filesOut" class="out"></div>
    <div id="grid" class="grid"></div>
  </section>

  <section>
    <h2>Lokatsiya</h2>
    <button id="locBtn" type="button">Lokatsiyani olish</button>
    <div id="locOut" class="out"></div>
  </section>

  <p id="env" class="env"></p>

<script>
  const tg = window.Telegram && window.Telegram.WebApp;
  const inMiniApp = !!(tg && tg.initData);
  if (tg) { tg.ready(); tg.expand(); }
  document.getElementById('env').textContent =
    inMiniApp ? 'Telegram Mini App ichida ochilgan (versiya ' + tg.version + ', ' + tg.platform + ').'
              : 'Oddiy brauzerda ochilgan. Lokatsiya brauzer orqali olinadi.';

  // Rasm va video: oyna yopilmaydi, sendData ishlatilmaydi
  const filesInput = document.getElementById('files');
  filesInput.addEventListener('change', () => {
    const grid = document.getElementById('grid');
    const out = document.getElementById('filesOut');
    grid.innerHTML = '';
    const list = Array.from(filesInput.files);
    if (!list.length) { out.innerHTML = '<span class="err">Fayl tanlanmadi.</span>'; return; }
    let total = 0;
    list.forEach(f => {
      total += f.size;
      const url = URL.createObjectURL(f);
      const el = f.type.startsWith('video') ? document.createElement('video') : document.createElement('img');
      el.src = url;
      if (el.tagName === 'VIDEO') { el.muted = true; el.playsInline = true; el.controls = true; }
      grid.appendChild(el);
    });
    out.innerHTML = '<span class="ok">Ishladi:</span> ' + list.length + ' ta fayl, jami ' +
      (total/1048576).toFixed(1) + ' MB. Oyna ochiq qoldi.';
  });

  // Lokatsiya: avval Telegram LocationManager, bo'lmasa brauzer geolokatsiyasi
  const locOut = document.getElementById('locOut');
  function showLoc(lat, lon, src, acc){
    const ll = lat.toFixed(6) + ',' + lon.toFixed(6);
    const accTxt = acc ? ' (aniqlik: ±' + Math.round(acc) + ' m)' : '';
    locOut.innerHTML = '<span class="ok">Ishladi (' + src + '):</span> ' + ll + accTxt +
      '<div class="nav">' +
      '<a class="navbtn" href="yandexnavi://build_route_on_map?lat_to=' + lat + '&lon_to=' + lon + '">Yandex Navigator</a>' +
      '<a class="navbtn alt" href="https://yandex.uz/maps/?rtext=~' + ll + '&rtt=auto" target="_blank">Yandex Xarita</a>' +
      '<a class="navbtn alt" href="https://www.google.com/maps/dir/?api=1&destination=' + ll + '&travelmode=driving" target="_blank">Google navigatsiya</a>' +
      '</div>';
  }
  function browserGeo(){
    if (!navigator.geolocation) { locOut.innerHTML = '<span class="err">Bu qurilmada lokatsiya olib bo\'lmaydi.</span>'; return; }
    locOut.textContent = 'GPS aniqlanmoqda... (15 soniyagacha)';
    let best = null;
    const finish = () => {
      navigator.geolocation.clearWatch(id); clearTimeout(timer);
      if (best) showLoc(best.latitude, best.longitude, 'GPS', best.accuracy);
    };
    const id = navigator.geolocation.watchPosition(
      p => {
        if (!best || p.coords.accuracy < best.accuracy) best = p.coords;
        locOut.textContent = 'GPS aniqlanmoqda... hozircha ±' + Math.round(best.accuracy) + ' m';
        if (best.accuracy <= 15) finish();
      },
      e => { navigator.geolocation.clearWatch(id); clearTimeout(timer);
             locOut.innerHTML = '<span class="err">Lokatsiya olinmadi:</span> ' + e.message +
             '. Telefonda GPS yoqilganini va ruxsat berilganini tekshiring.'; },
      { enableHighAccuracy: true, maximumAge: 0, timeout: 20000 }
    );
    const timer = setTimeout(finish, 15000);
  }
  document.getElementById('locBtn').addEventListener('click', () => {
    const lm = tg && tg.LocationManager;
    if (inMiniApp && lm && tg.isVersionAtLeast && tg.isVersionAtLeast('8.0')) {
      locOut.textContent = 'Lokatsiya olinmoqda...';
      lm.init(() => {
        if (!lm.isLocationAvailable) { browserGeo(); return; }
        lm.getLocation(loc => {
          if (loc) { showLoc(loc.latitude, loc.longitude, 'Telegram', loc.horizontal_accuracy); }
          else {
            locOut.innerHTML = '<span class="err">Ruxsat berilmadi.</span> Sozlamada ruxsat bering. ' +
              '<button type="button" id="openSet" style="margin-top:8px">Sozlamani ochish</button>';
            document.getElementById('openSet').onclick = () => lm.openSettings();
          }
        });
      });
    } else {
      browserGeo();
    }
  });
</script>
</body>
</html>
